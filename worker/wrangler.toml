name = "vision-pdv"
main = "src/index.ts"
compatibility_date = "2024-09-23"

routes = [
  { pattern = "visionpdv.marcatoapp.com.br", custom_domain = true }
]

# O site (pasta app/dist) e o servidor ficam no mesmo endereço.
[assets]
directory = "../app/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "vision-pdv-db"
database_id = "f4fa7665-92dd-4ee3-b1be-2fb1d086cce8"

[vars]
STORE_ID = "loja1"
# A chave de acesso NÃO fica aqui. Ela é cadastrada como segredo (API_KEY).
