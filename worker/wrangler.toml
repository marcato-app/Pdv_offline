name = "vision-pdv"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# O site principal atende *.marcatoapp.com.br. Esta regra é mais específica,
# então só "visionpdv" vem para cá; as outras empresas continuam no site principal.
routes = [
  { pattern = "visionpdv.marcatoapp.com.br/*", zone_name = "marcatoapp.com.br" }
]

# O site (pasta app/dist) e o servidor ficam no mesmo endereço.
[assets]
directory = "../app/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "vision-pdv-db"
database_id = "f4fa7665-92dd-4ee3-b1be-2fb1d086cce8"

# A chave mestra (para criar lojas) é o segredo API_KEY. Ela não fica neste arquivo.

[vars]
TRIAL_DAYS = "7"
# Link da página de compra (Mercado Pago, Kiwify, Hotmart…). O sistema acrescenta ?loja=<codigo>.
CHECKOUT_URL = ""
