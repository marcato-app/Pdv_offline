name: Publicar na Cloudflare

# Publica o site + servidor em https://visionpdv.marcatoapp.com.br
# sempre que a branch main muda (ou manualmente na aba Actions).
# Segredos necessários (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID e VISION_API_KEY (a chave de acesso dos caixas)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-cloudflare

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build do site
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Banco, servidor e chave de acesso
        working-directory: worker
        run: |
          npm ci
          npx wrangler d1 execute vision-pdv-db --remote --file=schema.sql
          npx wrangler deploy
          echo "${{ secrets.VISION_API_KEY }}" | npx wrangler secret put API_KEY
