name: Verificação

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: App (site)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Servidor (Cloudflare Worker)
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
