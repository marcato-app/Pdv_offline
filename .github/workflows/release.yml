name: Gerar instaladores

# Roda quando você cria uma tag (ex.: v1.0.0) ou manualmente na aba Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build do app
        working-directory: app
        run: |
          npm ci
          npm run build:app
      - name: Instalador Windows (.exe)
        working-directory: desktop
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/release/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build do app
        working-directory: app
        run: |
          npm ci
          npm run build:app
          npx cap sync android
      - name: APK Android
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../../Vision-PDV-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Vision-PDV-Android.apk

  publicar:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: Vision PDV ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            out/windows/*.exe
            out/android/*.apk
